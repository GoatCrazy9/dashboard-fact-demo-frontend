<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Facturación electrónica y gestión comercial de Mueblería José" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Mueblería José | Facturación</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar el parpadeo blanco.
      (function () {
        try {
          var guardado = localStorage.getItem('theme');
          var oscuro =
            guardado === 'dark' ||
            (guardado !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', oscuro);
          document.documentElement.setAttribute('data-color-scheme', oscuro ? 'dark' : 'light');
        } catch (error) {
          /* localStorage bloqueado: seguimos con el tema claro. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
